schema_version: 1

context:
  version: "4.14.0"

package:
  name: pytest-django
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pytest-django/pytest_django-${{ version }}.tar.gz
  sha256: 26787dd3f422cfbab8f55b80a776e2edea7a11092cb74e960bef1312515708ef

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0.0
    - setuptools-scm >=5.0.0
    - pip
  run:
    - python >=${{ python_min }}
    - pytest >=7.0.0

tests:
  - python:
      imports:
        - pytest_django
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A Django plugin for pytest.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/pytest-django/
  documentation: https://pytest-django.readthedocs.io/

extra:
  recipe-maintainers:
    - kwilcox
    - ocefpaf
